name: data_shaft
description: High-level data layer for Clean Architecture with standardized Drivers, typed DataSources, and Repository mixins for caching, deduplication, and safe error handling.
version: 2.0.0

publish_to: none

homepage: https://github.com/coolosos

repository: https://github.com/coolosos/data_shaft
issue_tracker: https://github.com/coolosos/data_shaft/issues

topics:
  - data
  - clean-architecture
  - repository
  - abstraction
  - architecture

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  meta: ^1.19.0
  cool_bedrock:
    git:
      url: git@github.com:coolosos/cool_bedrock
      ref: main

dev_dependencies:
  coolint: 3.0.0
  test: ^1.28.0
